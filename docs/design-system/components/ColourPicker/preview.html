<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ColourPicker</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-preview"><div class="vm-swatches" role="radiogroup" aria-label="Colour"><button class="vm-swatch" data-colour="none" role="radio" aria-checked="false" aria-label="None"></button><button class="vm-swatch" data-colour="red" role="radio" aria-checked="false" aria-label="Red"></button><button class="vm-swatch" data-colour="orange" role="radio" aria-checked="false" aria-label="Orange"></button><button class="vm-swatch" data-colour="yellow" role="radio" aria-checked="false" aria-label="Yellow"></button><button class="vm-swatch" data-colour="green" role="radio" aria-checked="false" aria-label="Green"></button><button class="vm-swatch" data-colour="blue" role="radio" aria-checked="true" aria-label="Blue"></button><button class="vm-swatch" data-colour="purple" role="radio" aria-checked="false" aria-label="Purple"></button><button class="vm-swatch" data-colour="grey" role="radio" aria-checked="false" aria-label="Grey"></button><button class="vm-swatch" data-colour="turquoise" role="radio" aria-checked="false" aria-label="Turquoise"></button></div></div>
</body>
</html>
