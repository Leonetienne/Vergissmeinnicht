<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SearchPopup</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-scrim" style="place-items:start center"><div class="vm-pop vm-pop--dialog" role="dialog" aria-label="Search">
<input class="vm-input" value="pass" aria-label="Search">
<ul class="vm-results" role="listbox">
<li class="vm-result" role="option" aria-selected="true">🧳 Passports and papers<span class="vm-result__where">Board</span></li>
<li class="vm-result" role="option">Renew passport<span class="vm-result__where">🏡 Household</span></li>
<li class="vm-result" role="option">Passport photos <span class="vm-tag">done</span><span class="vm-result__where">🏡 Household</span></li>
<li class="vm-result" role="option">Old passport copy <span class="vm-tag">archived</span><span class="vm-result__where">✈️ Lisbon trip</span></li>
</ul></div></div>
</body>
</html>
