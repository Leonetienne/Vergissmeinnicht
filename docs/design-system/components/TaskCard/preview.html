<!-- @dsCard group="Board" height=420 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TaskCard</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-preview vm-preview--col" style="width:300px;align-items:stretch"><div class="vm-card"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Buy forget-me-not seeds</span><span class="vm-card__note">Blue ones, not the white variety. Ask at the market on Saturday.</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card" data-colour="blue"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Renew passport</span><span class="vm-due vm-due--soon">Mar 14</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card" data-colour="red"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Pay electricity bill</span><span class="vm-due vm-due--now">Mar 10</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card vm-card--highlight" data-colour="green"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Water the balcony plants</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card vm-card--done"><input type="checkbox" class="vm-check" checked aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Call the landlord</span><span class="vm-due">Mar 2</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div></div>
</body>
</html>
