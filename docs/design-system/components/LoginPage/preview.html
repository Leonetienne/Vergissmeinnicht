<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LoginPage</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-preview vm-preview--col" style="padding:0;align-items:stretch">
<div class="vm-auth"><form class="vm-auth__panel">
<h1 class="vm-auth__app">Vergissmeinnicht</h1>
<label class="vm-field"><span>Email</span><input class="vm-input" type="email" value="leon@example.org" autocomplete="username"></label>
<label class="vm-field"><span>Password</span><input class="vm-input" type="password" value="hunter2hunter2" autocomplete="current-password"></label>
<p class="vm-error" role="alert">Email or password is wrong</p>
<button class="vm-btn vm-btn--primary" style="justify-content:center">Log in</button>
<p class="vm-auth__alt"><a class="vm-link" href="#">Create account</a></p>
</form></div>
<div class="vm-auth"><form class="vm-auth__panel">
<h1 class="vm-auth__app">Create account</h1>
<label class="vm-field"><span>Display name</span><input class="vm-input" value="Leon"></label>
<label class="vm-field"><span>Email</span><input class="vm-input" type="email" value="leon@example.org"></label>
<label class="vm-field"><span>Password</span><input class="vm-input" type="password" value="hunter2hunter2"></label>
<button class="vm-btn vm-btn--primary" style="justify-content:center">Create account</button>
<p class="vm-auth__alt"><a class="vm-link" href="#">Log in</a></p>
</form></div>
</div>
</body>
</html>
