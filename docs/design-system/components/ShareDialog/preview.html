<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ShareDialog</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-scrim"><div class="vm-pop vm-pop--dialog" role="dialog" aria-label="Share"><button class="vm-icon-btn vm-pop__close" aria-label="Close">×</button>
<h2 class="vm-pop__title">Share Household</h2>
<div class="vm-share"><span class="vm-share__who">Mara Lind<small>mara@example.org</small></span><select class="vm-select" aria-label="Role"><option>Observer</option><option selected>Editor</option></select><button class="vm-btn vm-btn--sm">Remove</button></div>
<div class="vm-share"><span class="vm-share__who">Jonas Weber<small>jonas@example.org</small></span><select class="vm-select" aria-label="Role"><option selected>Observer</option><option>Editor</option></select><button class="vm-btn vm-btn--sm">Remove</button></div>
<input class="vm-input" placeholder="Add by name or email" aria-label="Add user">
</div></div>
</body>
</html>
