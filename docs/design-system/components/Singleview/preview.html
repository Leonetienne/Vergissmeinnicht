<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Singleview</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-scrim"><div class="vm-pop" role="dialog" aria-label="Task"><button class="vm-icon-btn vm-pop__close" aria-label="Close">×</button>
<label class="vm-field"><span>Title</span><input class="vm-input" value="Renew passport"></label>
<label class="vm-field"><span>Due date</span><div class="vm-row"><input class="vm-input" type="date" value="2026-03-14"><button class="vm-btn vm-btn--sm vm-btn--ghost">Clear</button></div></label>
<div class="vm-field"><span>Colour</span><div class="vm-swatches" role="radiogroup" aria-label="Colour"><button class="vm-swatch" data-colour="none" role="radio" aria-checked="false" aria-label="None"></button><button class="vm-swatch" data-colour="red" role="radio" aria-checked="false" aria-label="Red"></button><button class="vm-swatch" data-colour="orange" role="radio" aria-checked="false" aria-label="Orange"></button><button class="vm-swatch" data-colour="yellow" role="radio" aria-checked="false" aria-label="Yellow"></button><button class="vm-swatch" data-colour="green" role="radio" aria-checked="false" aria-label="Green"></button><button class="vm-swatch" data-colour="blue" role="radio" aria-checked="true" aria-label="Blue"></button><button class="vm-swatch" data-colour="purple" role="radio" aria-checked="false" aria-label="Purple"></button><button class="vm-swatch" data-colour="grey" role="radio" aria-checked="false" aria-label="Grey"></button><button class="vm-swatch" data-colour="turquoise" role="radio" aria-checked="false" aria-label="Turquoise"></button></div></div>
<label class="vm-field"><span>Note</span><textarea class="vm-textarea">Appointment at the citizen office, bring the old passport and a photo.</textarea></label>
<a class="vm-link vm-link--meta" href="#" style="justify-self:end">Json export</a>
</div></div>
</body>
</html>
