<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>List</title><style>html,body{margin:0}body{background:var(--bg)}</style></head>
<body>
<div class="vm-preview" style="padding-right:0"><div class="vm-board">
<div class="vm-list vm-list--default"><div class="vm-card"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Take out recycling</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Book dentist</span><span class="vm-due vm-due--soon">Mar 12</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><input class="vm-input vm-input--entry" placeholder="New task" aria-label="New task"><a class="vm-link vm-link--meta vm-list__export" href="#">Json export</a></div>
<div class="vm-list"><div class="vm-list__header"><span class="vm-inline">Groceries</span><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete list"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button></div><div class="vm-card" data-colour="yellow"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Oat milk</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card"><input type="checkbox" class="vm-check" aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Bread</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><div class="vm-card vm-card--done"><input type="checkbox" class="vm-check" checked aria-label="Done"><div class="vm-card__body"><span class="vm-card__title">Coffee beans</span></div><div class="vm-card__actions"><button class="vm-icon-btn" aria-label="Open details">...</button><button class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task">×</button></div></div><input class="vm-input vm-input--entry" placeholder="New task" aria-label="New task"><a class="vm-link vm-link--meta vm-list__export" href="#">Json export</a></div>
</div></div>
