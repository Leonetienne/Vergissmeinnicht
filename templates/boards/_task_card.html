<article class="vm-card" :id="'task-' + task.id" :data-task-id="task.id" tabindex="0" :aria-label="task.title"
         :data-colour="task.colour !== 'none' ? task.colour : null"
         :class="{ 'vm-card--done': task.state === 'done', 'vm-card--drag': editable, 'vm-card--highlight': highlighted === task.id }"
         @click="openSingle(task)" @keydown.enter.self="openSingle(task)">
  {% if archive %}
  <template x-if="canEdit"><input type="checkbox" class="vm-check" aria-label="Select" :value="task.id" x-model.number="selected" @click.stop></template>
  <template x-if="!canEdit"><span></span></template>
  {% else %}
  <input type="checkbox" class="vm-check" aria-label="Done" :checked="task.state === 'done'" :disabled="!canEdit"
         @click.stop @change="toggle(task, $event.target)">
  {% endif %}
  <div class="vm-card__body">
    <span class="vm-card__title">
      {% include "partials/_inline_edit.html" with get="() => task.title" set="v => updateTask(task, { title: v })" label="task title" editable="editable" maxlength=200 %}
    </span>
    <span class="vm-due" :class="dueClass(task)" x-show="task.due_date" x-text="formatDate(task.due_date)"></span>
    <span class="vm-card__note" x-show="task.note" x-text="task.note"></span>
  </div>
  <div class="vm-card__actions">
    <template x-if="editable">
      <button type="button" class="vm-icon-btn vm-icon-btn--danger" aria-label="Delete task" @click.stop="deleteTask(task)">×</button>
    </template>
  </div>
</article>
