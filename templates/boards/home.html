{% extends "base.html" %}
{% block content %}
<div class="vm-boards" x-data="boardList">
  <h1 class="vm-section-title">My boards</h1>
  <div class="vm-boards" style="width:100%" x-ref="own">
    <template x-for="board in own" :key="board.id">
      <div class="vm-board-entry" :data-board-id="board.id">
        <a class="vm-board-entry__link" :href="board.url" draggable="false" :aria-label="'Open ' + board.title"></a>
        {% include "partials/_emoji_picker.html" with get="() => board.emoji" set="e => setEmoji(board, e)" editable="true" %}
        <span class="vm-board-entry__name">
          {% include "partials/_inline_edit.html" with get="() => board.title" set="v => rename(board, v)" label="board title" editable="true" %}
        </span>
        <span class="vm-board-entry__desc" x-show="board.description" x-text="board.description.split('\n')[0]"></span>
      </div>
    </template>
  </div>
  <input class="vm-input vm-input--entry" placeholder="New board" aria-label="New board" maxlength="100"
         @keydown.enter.prevent="create($event.target)">

  <template x-if="shared.length">
    <div class="vm-boards vm-boards__section" style="width:100%">
      <h2 class="vm-section-title">Shared with me</h2>
      <template x-for="board in shared" :key="board.id">
        <div class="vm-board-entry">
          <a class="vm-board-entry__link" :href="board.url" :aria-label="'Open ' + board.title"></a>
          <span class="vm-emoji vm-emoji--readonly" x-text="board.emoji"></span>
          <span class="vm-board-entry__name" x-text="board.title"></span>
          <span class="vm-board-entry__desc" x-show="board.description" x-text="board.description.split('\n')[0]"></span>
          <span class="vm-board-entry__meta" x-text="board.owner.display_name + ' · ' + (board.role === 'editor' ? 'Editor' : 'Observer')"></span>
        </div>
      </template>
    </div>
  </template>
</div>
{% endblock %}
{% block page_data %}{{ page_data|json_script:"vm-page-data" }}{% endblock %}
