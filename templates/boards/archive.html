{% extends "base.html" %}
{% block title %}Archive · {{ board.name }} · Vergissmeinnicht{% endblock %}
{% block content %}
<div x-data="archivePage">
  <div class="vm-page-title">
    <span class="vm-emoji vm-emoji--readonly" x-show="board.emoji" x-text="board.emoji"></span>
    <h1 x-text="board.name + ': Archive'"></h1>
  </div>
  <div class="vm-archive-tools">
    <a class="vm-btn" :href="board.url" style="text-decoration:none">Leave archive</a>
    <template x-if="canEdit">
      <button type="button" class="vm-btn vm-btn--primary" :disabled="!selected.length" @click="unarchive()">Unarchive selected</button>
    </template>
  </div>
  <template x-for="list in groups" :key="list.id">
    <section class="vm-archive-group">
      <template x-if="!list.is_default"><h2 class="vm-section-title" x-text="list.title"></h2></template>
      <template x-for="task in list.tasks" :key="task.id">
        <article class="vm-card" :id="'task-' + task.id" :data-task-id="task.id"
                 :data-colour="task.colour !== 'none' ? task.colour : null" :class="highlighted === task.id && 'vm-card--highlight'">
          <template x-if="canEdit">
            <input type="checkbox" class="vm-check" aria-label="Select" :value="task.id" x-model.number="selected">
          </template>
          <template x-if="!canEdit"><span></span></template>
          <div class="vm-card__body">
            <span class="vm-card__title" x-text="task.title"></span>
            <span class="vm-due" x-show="task.due_date" x-text="formatDate(task.due_date)"></span>
            <span class="vm-card__note" x-show="task.note" x-text="task.note"></span>
          </div>
          <span></span>
        </article>
      </template>
    </section>
  </template>
  <p class="vm-empty" x-show="!groups.length">Nothing archived.</p>
</div>
{% endblock %}
{% block page_data %}{{ page_data|json_script:"vm-page-data" }}{% endblock %}
