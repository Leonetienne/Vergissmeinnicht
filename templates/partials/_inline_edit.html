{% comment %}Params: get, set (JS arrow functions), label, editable (JS expression), optional maxlength.{% endcomment %}
<span class="vm-inline-host" x-data="inlineEdit({{ get }}, {{ set }})">
  <template x-if="!({{ editable }})"><span x-text="value"></span></template>
  <template x-if="{{ editable }}">
    <span class="vm-inline" tabindex="0" role="button" aria-label="Edit {{ label }}" x-show="!editing" x-text="value"
          @click.stop.prevent="start()" @keydown.enter.prevent="start()"></span>
  </template>
  <input class="vm-inline-input" x-show="editing" x-cloak x-ref="input" x-model="draft" aria-label="{{ label }}"
         maxlength="{{ maxlength|default:100 }}" :size="Math.max(draft.length, 4)"
         @click.stop.prevent @keydown.enter.prevent="commit()" @keydown.escape.prevent.stop="cancel()" @blur="commit()">
</span>
