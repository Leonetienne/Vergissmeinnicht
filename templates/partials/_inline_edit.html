{% comment %}Params: get, set (JS arrow functions), label, editable (JS expression), optional link (JS expression for an href) and maxlength.{% endcomment %}
<span class="vm-inline-host" x-data="inlineEdit({{ get }}, {{ set }})">
  {% if link %}
  <a class="vm-board-entry__name" :href="{{ link }}" x-show="!editing" x-text="value"></a>
  <template x-if="{{ editable }}">
    <button type="button" class="vm-icon-btn" aria-label="Rename {{ label }}" x-show="!editing" @click.prevent="start()">
      <svg viewBox="0 0 16 16"><path d="M10.5 3 13 5.5 6 12.5H3.5V10z"/></svg>
    </button>
  </template>
  {% else %}
  <template x-if="!({{ editable }})"><span x-text="value"></span></template>
  <template x-if="{{ editable }}">
    <span class="vm-inline" tabindex="0" role="button" aria-label="Edit {{ label }}" x-show="!editing" x-text="value"
          @click.stop.prevent="start()" @keydown.enter.prevent="start()"></span>
  </template>
  {% endif %}
  <input class="vm-inline-input" x-show="editing" x-cloak x-ref="input" x-model="draft" aria-label="{{ label }}"
         maxlength="{{ maxlength|default:100 }}" :size="Math.max(draft.length, 4)"
         @click.stop @keydown.enter.prevent="commit()" @keydown.escape.prevent.stop="cancel()" @blur="commit()">
</span>
